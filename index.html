<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ cá Koi - Hình nền động</title>
    <!-- 首帧底色内联:外部 style.css 要等一个请求,而这几毫秒里露出来的是 WE/CEF 的默认白。
     内联之后 HTML 一解析完就是深水色,白闪被压到最短。值必须与 style.css 的 body 底色一致。 -->
<style>html,body{background:#0a1f20}</style>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="photo-frames.css">
<link rel="stylesheet" href="audio-reactive.css">
</head>
<body>
    <div id="vignette"></div>
    <canvas id="wallpaper-canvas"></canvas>
    <!-- 形状真源:编辑器(editor.html)和壁纸共用同一份,必须在 script.js 之前加载 -->
    <script src="theme.js"></script>
    <script src="koishape.js"></script>
    <!-- 光感 / 涟漪的 WebGL 生成器(值 = 用户认可的基线,见 watergl.js 头部注释)。
         它只生成"要叠上去的那张图",合成仍然由 script.js 的 ctx 做 ——
         所以池塘、鱼、饲料、时间、水面扰动全都不动。 -->
    <script src="watergl.js"></script>
    <script>globalThis.KoiShared = { THEME, KOI_SHAPE, WaterGL };</script>
    <!-- Classic bundle works both in Wallpaper Engine and when index.html is opened via file://. -->
    <script src="app.bundle.js"></script>
    <script src="photo-frames.js"></script>
<script src="audio-reactive.js"></script>
</body>
</html>
